      summary: Zwolnienie ręcznej blokady
      description: |
        Tylko blokady `MANUAL`; blokady płatności (`PAYMENT`) zwalnia cykl życia płatności → `409` `conflict`.
        Powtórzenie na zwolnionej blokadzie jest idempotentne (`204`).
      parameters:
