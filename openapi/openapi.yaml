openapi: 3.1.0
info:
  title: bank core-api
  version: 0.2.0
  description: |
    Kontrakt REST `core-api` (`/api/v1`). Normatywny dla wszystkich aplikacji webowych; klienty generują się
    z tego pliku w czasie builda (`docs/architecture.md` §1a). Zmiany są wyłącznie addytywne
    (`docs/integration-contracts.md` §3).

    Tagi: `customer` (rola CUSTOMER, używa `customer-web`), `operator` (OPERATOR i ADMIN; zapisy księgowe
    i stopy tylko ADMIN — patrz `x-roles` operacji) oraz `admin` (tylko ADMIN). `backoffice-web` używa `operator`/`admin`.
    Historia: v0.1 (2026-09-10) endpointy `customer`; v0.2 (2026-09-10) endpointy `operator`/`admin`.

    Konwencje:
    - kwoty `Money = {minor, currency}`; nigdy liczby zmiennoprzecinkowe;
    - daty `YYYY-MM-DD`, chwile RFC 3339 w UTC;
    - błędy `application/problem+json` ze stabilnym `type` `https://bank.local/problems/<slug>`;
    - paginacja kursorowa `?cursor=&limit=` → `{items, nextCursor}`;
    - każde żądanie mutujące wymaga nagłówka `Idempotency-Key` (UUID); powtórzenie zwraca oryginalny wynik.
servers:
  - url: http://localhost:8080/api/v1
    description: dev (compose / lokalnie)
tags:
  - name: customer
    description: Endpointy klienta (`/me/*`), rola `CUSTOMER`. Klient widzi wyłącznie własne zasoby.
  - name: operator
    description: |
      Konsola operatora (`backoffice-web`). Odczyty: `OPERATOR` i `ADMIN`. Zapisy oznaczone `x-roles: [ADMIN]`
      (ręczne księgowania, storna, stopy) wymagają `ADMIN`. Operator widzi wszystkich klientów; własność nie ogranicza.
  - name: admin
    description: "Administracja (`ADMIN`): kalendarz i EOD, przebiegi zadań."
security:
  - bearerAuth: []

paths:
  /me:
    get:
      tags: [customer]
      operationId: getMe
      x-roles: [CUSTOMER]
      summary: Profil zalogowanego klienta
      description: Klient jest identyfikowany przez claim `sub` tokenu (mapowany na `customer.keycloak_sub`).
      responses:
        "200":
          description: Profil klienta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/accounts:
    get:
      tags: [customer]
      operationId: listMyAccounts
      x-roles: [CUSTOMER]
      summary: Rachunki zalogowanego klienta
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Strona rachunków
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [customer]
      operationId: getMyAccount
      x-roles: [CUSTOMER]
      summary: Szczegóły własnego rachunku
      description: Rachunek innego klienta zwraca `404` (`not-found`), nie `403`, żeby nie ujawniać istnienia zasobu.
      responses:
        "200":
          description: Rachunek
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/accounts/{accountId}/transactions:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [customer]
      operationId: listMyAccountTransactions
      x-roles: [CUSTOMER]
      summary: Historia rachunku
      description: |
        Pozycje wyprowadzone z postingów na subkoncie GL rachunku, od najnowszej. `amount.minor` jest ze znakiem
        z perspektywy klienta: dodatni = uznanie rachunku, ujemny = obciążenie. `balanceAfter` to saldo księgowe
        po tej pozycji. Filtry dat dotyczą `bookingDate` (obustronnie domknięte).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: Najwcześniejsza `bookingDate` (włącznie)
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Najpóźniejsza `bookingDate` (włącznie)
      responses:
        "200":
          description: Strona historii
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/payments:
    get:
      tags: [customer]
      operationId: listMyPayments
      x-roles: [CUSTOMER]
      summary: Płatności zalogowanego klienta
      description: Od najnowszej. Obejmuje płatności wychodzące z rachunków klienta oraz przychodzące na nie.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentStatus"
          description: Filtr po statusie
        - name: accountId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Tylko płatności powiązane z tym rachunkiem klienta
      responses:
        "200":
          description: Strona płatności
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPage"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [customer]
      operationId: createMyPayment
      x-roles: [CUSTOMER]
      summary: Utworzenie przelewu
      description: |
        Tworzy płatność w stanie `PENDING_CONFIRMATION`, zakłada blokadę na kwotę i publikuje
        `payment.confirmation_requested` (kod trafia e-mailem). `kind` ustala serwer: `INTERNAL`, gdy IBAN odbiorcy
        należy do tego banku, inaczej `EXTERNAL_OUT`. Reguły: `docs/business-rules.md` §3–4.
        Powtórzenie z tym samym `Idempotency-Key` zwraca `200` z oryginalną płatnością.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Płatność utworzona, oczekuje na kod potwierdzenia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "200":
          description: Powtórzone żądanie (ten sam `Idempotency-Key`) — oryginalna płatność
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: |
            Reguła biznesowa odrzuciła przelew. `type` jeden z: `insufficient-funds`, `limit-exceeded`,
            `invalid-iban`, `business-day-closed`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      tags: [customer]
      operationId: getMyPayment
      x-roles: [CUSTOMER]
      summary: Status i szczegóły płatności
      description: UI odpytuje ten endpoint, dopóki `status` nie jest terminalny (`SETTLED`, `REJECTED`, `RETURNED`).
      responses:
        "200":
          description: Płatność
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/payments/{paymentId}/confirm:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [customer]
      operationId: confirmMyPayment
      x-roles: [CUSTOMER]
      summary: Potwierdzenie przelewu kodem z e-maila
      description: |
        Poprawny kod: płatność jest księgowana (`POSTED`; wewnętrzna od razu `SETTLED`). Błędny kod: `422`
        `confirmation-failed` ze zaktualizowanym `attemptsLeft` w `Problem.extensions`; po wyczerpaniu prób
        lub po upływie `expiresAt` płatność przechodzi w `REJECTED` (`422` `confirmation-expired`).
        Płatność w stanie innym niż `PENDING_CONFIRMATION` → `409` `conflict`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPaymentRequest"
      responses:
        "200":
          description: Płatność po potwierdzeniu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`confirmation-failed`, `confirmation-expired`, `insufficient-funds`, `business-day-closed`"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/standing-orders:
    get:
      tags: [customer]
      operationId: listMyStandingOrders
      x-roles: [CUSTOMER]
      summary: Zlecenia stałe klienta
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StandingOrderStatus"
      responses:
        "200":
          description: Strona zleceń
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingOrderPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [customer]
      operationId: createMyStandingOrder
      x-roles: [CUSTOMER]
      summary: Utworzenie zlecenia stałego
      description: |
        Zlecenie jest potwierdzone przy utworzeniu (bez kodu). `nextRunDate` wylicza serwer z `frequency`,
        `dayOfPeriod` i `startDate` (`docs/business-rules.md` §5). Powtórzenie z tym samym `Idempotency-Key`
        zwraca `200` z oryginalnym zleceniem.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandingOrderRequest"
      responses:
        "201":
          description: Zlecenie utworzone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingOrder"
        "200":
          description: Powtórzone żądanie — oryginalne zlecenie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingOrder"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`invalid-iban`, `limit-exceeded`"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/standing-orders/{standingOrderId}:
    parameters:
      - $ref: "#/components/parameters/StandingOrderId"
    get:
      tags: [customer]
      operationId: getMyStandingOrder
      x-roles: [CUSTOMER]
      summary: Szczegóły zlecenia stałego
      responses:
        "200":
          description: Zlecenie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingOrder"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [customer]
      operationId: updateMyStandingOrder
      x-roles: [CUSTOMER]
      summary: Zmiana zlecenia stałego
      description: |
        Pełna wymiana danych zlecenia (`ACTIVE`). Serwer przelicza `nextRunDate`. Zlecenie `CANCELLED` → `409`.
        Współbieżna modyfikacja (niezgodna `version`) → `409` `conflict`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStandingOrderRequest"
      responses:
        "200":
          description: Zaktualizowane zlecenie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingOrder"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`invalid-iban`, `limit-exceeded`"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [customer]
      operationId: cancelMyStandingOrder
      x-roles: [CUSTOMER]
      summary: Anulowanie zlecenia stałego
      description: Zlecenie przechodzi w `CANCELLED` (rekord zostaje). Powtórzenie jest idempotentne (`204`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Anulowane
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── operator: dane referencyjne ─────────────────────────────

  /products:
    get:
      tags: [operator]
      operationId: listProducts
      x-roles: [OPERATOR, ADMIN]
      summary: Produkty rachunków
      description: Dane referencyjne (`docs/domain-model.md` §3 `product`), porządek `code` rosnąco. Używane przy otwieraniu rachunku i przy stopach.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Strona produktów
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── operator: klienci ─────────────────────────────

  /customers:
    get:
      tags: [operator]
      operationId: listCustomers
      x-roles: [OPERATOR, ADMIN]
      summary: Lista i wyszukiwanie klientów
      description: Porządek `createdAt` malejąco.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 140 }
          description: Fragment nazwiska lub e-maila (bez rozróżniania wielkości liter)
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CustomerStatus"
      responses:
        "200":
          description: Strona klientów, od najnowszego
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [operator]
      operationId: createCustomer
      x-roles: [OPERATOR, ADMIN]
      summary: Utworzenie klienta
      description: |
        Rekord klienta powiązany z istniejącym użytkownikiem Keycloak (`keycloakSub`, jeden użytkownik ↔ jeden klient).
        Użytkownika zakłada się najpierw w Keycloak (Admin Console → realm `bank` → Users, rola `CUSTOMER`); `keycloakSub`
        to pole *ID* użytkownika (równe claimowi `sub` tokenu). `email` powinien zgadzać się z Keycloak (core-api tego nie
        weryfikuje — nie woła Keycloak po HTTP). Publikuje `customer.created`. Duplikat `keycloakSub` → `409` `conflict`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Klient utworzony
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCustomer"
        "200":
          description: Powtórzone żądanie — oryginalny klient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCustomer"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [operator]
      operationId: getCustomer
      x-roles: [OPERATOR, ADMIN]
      summary: Szczegóły klienta
      responses:
        "200":
          description: Klient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCustomer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [operator]
      operationId: updateCustomer
      x-roles: [OPERATOR, ADMIN]
      summary: Zmiana danych lub statusu klienta
      description: |
        Pola pominięte pozostają bez zmian; `status` równy bieżącemu to no-op (`200`). Maszyna stanów
        (`docs/domain-model.md` §4): `ACTIVE ⇄ BLOCKED`; `→ CLOSED` z `ACTIVE` lub `BLOCKED`, tylko gdy wszystkie rachunki
        klienta są `CLOSED`; `CLOSED` jest terminalny — każda zmiana klienta `CLOSED` → `409` `conflict`.
        `BLOCKED` blokuje wyłącznie komendy klienta (`POST /me/payments`, `POST`/`PUT` `/me/standing-orders` → `403`
        `forbidden`); odczyty, rachunki, uznania przychodzące, EOD i istniejące zlecenia działają bez zmian, status
        rachunków nie kaskaduje. Zmiana `status` wymaga `reason` (inaczej `400` `validation`). Niezgodna `version` → `409`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: Zaktualizowany klient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCustomer"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /customers/{customerId}/accounts:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [operator]
      operationId: listCustomerAccounts
      x-roles: [OPERATOR, ADMIN]
      summary: Rachunki klienta
      description: Porządek `openedOn` malejąco.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Strona rachunków
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAccountPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [operator]
      operationId: openAccount
      x-roles: [OPERATOR, ADMIN]
      summary: Otwarcie rachunku
      description: |
        Generuje IBAN/NRB (`docs/business-rules.md` §2), tworzy subkonto GL `2000-<accountId>` z saldem 0,
        publikuje `account.opened`. Klient musi być `ACTIVE` (inaczej `409` `conflict`). Nieznany `productCode` → `404`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountRequest"
      responses:
        "201":
          description: Rachunek otwarty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAccount"
        "200":
          description: Powtórzone żądanie — oryginalny rachunek
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAccount"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── operator: rachunki ─────────────────────────────

  /accounts:
    get:
      tags: [operator]
      operationId: searchAccounts
      x-roles: [OPERATOR, ADMIN]
      summary: Wyszukiwanie rachunków
      description: Porządek `openedOn` malejąco (z filtrami i bez). Co najmniej jeden filtr jest zalecany; bez filtrów zwraca wszystkie rachunki.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: iban
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 34 }
          description: Pełny IBAN albo jego końcówka (≥ 4 znaki)
        - name: customerId
          in: query
          required: false
          schema: { type: string, format: uuid }
