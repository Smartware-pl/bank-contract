  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [operator]
      operationId: getAccount
      x-roles: [OPERATOR, ADMIN]
      summary: Szczegóły rachunku
      responses:
        "200":
          description: Rachunek
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAccount"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [operator]
      operationId: changeAccountStatus
      x-roles: [OPERATOR, ADMIN]
      summary: Zmiana statusu rachunku
      description: |
        `ACTIVE → BLOCKED`, `BLOCKED → ACTIVE`, `ACTIVE → CLOSED`. Inne przejścia i niezgodna `version` → `409` `conflict`.
        `ACTIVE → CLOSED` wykonuje się w tej kolejności, w jednej transakcji (`docs/business-rules.md` §8):
        (1) `version` zgodna i przejście dozwolone; (2) brak aktywnych blokad, inaczej `409` `conflict`;
        (3) jeśli są naliczone, nieskapitalizowane odsetki (`accruedInterest > 0`) — zapis `CAPITALIZATION` (wymaga dnia
        `OPEN`, inaczej `422` `business-day-closed`); (4) saldo po kapitalizacji musi być 0, inaczej `409` `conflict`
        z `extensions.balance` — rachunek zostaje `ACTIVE`, kapitalizacja pozostaje zaksięgowana, operator przenosi
        środki i powtarza. Dialog potwierdzenia w UI pokazuje `balance`, `holdsTotal` i `accruedInterest`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStatusChangeRequest"
      responses:
        "200":
          description: Rachunek po zmianie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAccount"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`business-day-closed` (kapitalizacja przy zamknięciu wymaga dnia `OPEN`)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

