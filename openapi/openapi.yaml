  /payments/{paymentId}/return:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [operator]
      operationId: returnPayment
      x-roles: [OPERATOR, ADMIN]
      summary: Ręczny zwrot płatności
      description: |
        Tylko dla płatności `POSTED` (w praktyce `EXTERNAL_OUT` czekająca na izbę; wewnętrzne są `SETTLED` natychmiast):
        księguje `REVERSAL` odwracający zapis `entryId` (postingi oryginału z odwróconym znakiem, `bookingDate` =
        `businessDate` = bieżący dzień `OPEN`), płatność → `RETURNED` z `reasonCode`, publikuje `payment.returned`.
        To jedyne storno dostępne dla `OPERATOR` — utrzymuje maszynę stanów płatności spójną z księgą
        (`docs/business-rules.md` §9). Inny status (w tym `SETTLED`) → `409` `conflict`; niezgodna `version` (jeśli
        podana) → `409`; dzień roboczy nie `OPEN` → `422` `business-day-closed`. Oflagowane w audycie.
