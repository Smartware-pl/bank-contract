  # ───────────────────────────── operator/admin: księga ─────────────────────────────

  /ledger/gl-accounts:
    get:
      tags: [operator]
      operationId: listGlAccounts
      x-roles: [OPERATOR, ADMIN]
      summary: Plan kont z saldami
      description: |
        Konta GL (`docs/domain-model.md` §2) z saldem na bieżącą datę biznesową, porządek `code` rosnąco. Saldo jest sumą
        postingów ze znakiem: dodatnie = debetowe (Wn), ujemne = kredytowe (Ma). UI wyprowadza stronę ze znaku; API nie
        zwraca flagi dr/cr. Konto nadrzędne (np. `2000`) ma saldo roll-up (własne postingi + wszystkich potomków).
        Domyślnie bez subkont klientów `2000-*` (`includeCustomerSubaccounts=true`, żeby je dołączyć); `parentCode` ma
        pierwszeństwo — `parentCode=2000` zwraca subkonta niezależnie od `includeCustomerSubaccounts`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GlAccountType"
        - name: parentCode
          in: query
          required: false
          schema: { type: string }
          description: Tylko dzieci tego konta (np. `2000` → subkonta klientów)
        - name: includeCustomerSubaccounts
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Strona kont GL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccountPage"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /ledger/gl-accounts/{code}:
    parameters:
      - $ref: "#/components/parameters/GlAccountCode"
    get:
      tags: [operator]
      operationId: getGlAccount
      x-roles: [OPERATOR, ADMIN]
      summary: Konto GL z saldem
      responses:
        "200":
          description: Konto GL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlAccount"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ledger/entries:
    get:
      tags: [operator]
      operationId: listJournalEntries
      x-roles: [OPERATOR, ADMIN]
      summary: Zapisy księgowe
      description: Porządek `bookingDate` malejąco, potem sekwencja zapisu (liczbowo z `JE-<sekwencja>`) malejąco. Filtr `glAccountCode` zwraca zapisy z co najmniej jednym postingiem na tym koncie.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: glAccountCode
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JournalEntryType"
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: Najwcześniejsza `bookingDate`
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Najpóźniejsza `bookingDate`
        - name: referenceType
          in: query
          required: false
          schema: { type: string }
        - name: referenceId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Strona zapisów (z postingami)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryPage"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /ledger/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    get:
      tags: [operator]
      operationId: getJournalEntry
      x-roles: [OPERATOR, ADMIN]
      summary: Zapis księgowy z postingami
      responses:
        "200":
          description: Zapis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ledger/entries/{entryId}/reverse:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    post:
      tags: [operator]
      operationId: reverseJournalEntry
      x-roles: [ADMIN]
      summary: Storno zapisu
      description: |
        Nowy zapis `REVERSAL`: te same konta z odwróconym znakiem kwot, `reversalOfEntryId` = oryginał, `bookingDate` =
        `valueDate` = `businessDate` = bieżący dzień (`docs/business-rules.md` §9); oryginał pozostaje nietknięty
        (dostaje `reversedByEntryId`). Storno jest wyłącznie księgowe — nie zmienia płatności, blokad, `accrual_daily`
        ani `capitalization_run`; dlatego zapis z `referenceType = PAYMENT` → `409` `conflict` (jedyna droga:
        `POST /payments/{id}/return`). Zapis już wystornowany albo sam będący `REVERSAL` → `409` `conflict`.
        Dozwolone w dniu `OPEN` oraz — wyjątkowo — w dniu `CLOSING`, którego `closingJobRunId` jest `FAILED` (korekta
        uzgodnienia przed wznowieniem EOD; wtedy `businessDate` = dzień `CLOSING`); `CLOSING` z przebiegiem `RUNNING`
        → `422` `business-day-closed`. UI pokazuje podgląd storna jako postingi oryginału z odwróconym znakiem. Oflagowane w audycie.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseEntryRequest"
      responses:
        "201":
          description: Zapis storna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "200":
          description: Powtórzone żądanie — oryginalny zapis storna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`business-day-closed`"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /ledger/entries:manual:
    post:
      tags: [operator]
      operationId: postManualEntry
      x-roles: [ADMIN]
      summary: Ręczne księgowanie
      description: |
        Zapis `MANUAL` z ≥ 2 postingami sumującymi się do zera w jednej walucie (`422` `unbalanced-entry`).
        `bookingDate` = `businessDate` = bieżący dzień (bez datowania wstecz); `valueDate` opcjonalnie, domyślnie = `bookingDate`.
        Moduł `ledger` nie zna statusu rachunku ani salda dostępnego: zapis ręczny może obciążyć `2000-*` poniżej zera
        i dotyczyć rachunku `BLOCKED`/`CLOSED` (reguły `docs/business-rules.md` §4 obowiązują tylko płatności) — dlatego
        `reason` jest zawsze wymagane, a postingi na `2000-*` są oflagowane w audycie. Nieznane konto GL → `404`.
        Dozwolone w dniu `OPEN` oraz w dniu `CLOSING`, którego `closingJobRunId` jest `FAILED` (korekta uzgodnienia;
        `businessDate` = dzień `CLOSING`); `CLOSING` z przebiegiem `RUNNING` → `422` `business-day-closed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualEntryRequest"
      responses:
        "201":
          description: Zaksięgowany zapis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "200":
          description: Powtórzone żądanie — oryginalny zapis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "`unbalanced-entry`, `business-day-closed`"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ───────────────────────────── admin: stopy ─────────────────────────────

  /interest/rate-schedules:
    get:
      tags: [operator]
      operationId: listRateSchedules
      x-roles: [OPERATOR, ADMIN]
      summary: Harmonogramy stóp
      description: |
        Porządek `effectiveFrom` malejąco. Dla produktu obowiązuje (`status = IN_FORCE`) harmonogram o największym
        `effectiveFrom ≤ businessDate`; wcześniejsze są `SUPERSEDED`, późniejsze `SCHEDULED`. Stopa nie jest przypinana
        do rachunku (`docs/business-rules.md` §7).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: productCode
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RateScheduleStatus"
      responses:
        "200":
          description: Strona harmonogramów
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateSchedulePage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [operator]
      operationId: createRateSchedule
      x-roles: [ADMIN]
      summary: Nowy harmonogram stóp
      description: |
        Harmonogramy są append-only: zmiana stopy to nowy harmonogram. `effectiveFrom` ≥ `nextBusinessDate` i większy niż
        `effectiveFrom` najnowszego harmonogramu produktu — inaczej `400` `validation` z `errors[{field: effectiveFrom}]`.
        Para (`productCode`, `effectiveFrom`) jest unikalna → `409` `conflict`. Progi rosnąco po `upToMinor`, ostatni próg
        `upToMinor: null` (bez górnej granicy). Stopy w punktach bazowych. Nieznany `productCode` → `404`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRateScheduleRequest"
      responses:
        "201":
          description: Harmonogram utworzony
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateSchedule"
        "200":
          description: Powtórzone żądanie — oryginalny harmonogram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateSchedule"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /interest/rate-schedules/{rateScheduleId}:
    parameters:
      - $ref: "#/components/parameters/RateScheduleId"
    get:
      tags: [operator]
      operationId: getRateSchedule
      x-roles: [OPERATOR, ADMIN]
      summary: Harmonogram stóp
      responses:
        "200":
          description: Harmonogram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateSchedule"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── admin: kalendarz i EOD ─────────────────────────────

  /business-days:
    get:
      tags: [admin]
      operationId: listBusinessDays
      x-roles: [ADMIN]
      summary: Kalendarz dni roboczych
      description: "Dni z kalendarza (`docs/business-rules.md` §6) w zakresie dat, rosnąco. Bez zakresu: 30 dni wstecz od bieżącej daty biznesowej i 30 naprzód."
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BusinessDayStatus"
      responses:
        "200":
          description: Strona dni
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDayPage"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /business-days/current:
    get:
      tags: [admin]
      operationId: getCurrentBusinessDay
      x-roles: [ADMIN]
      summary: Bieżący dzień biznesowy
      description: |
        Dokładnie jeden dzień jest `OPEN` albo `CLOSING` (w trakcie EOD). Dla dnia `CLOSING` `closingJobRunId` = najnowszy
        przebieg orkiestratora tego dnia (`RUNNING` — EOD trwa; `FAILED` — dzień wymaga interwencji ADMIN: korekta księgowa
        przez `/ledger/entries:manual` lub `/reverse`, potem ponowne `POST /business-days:close`, które wznawia łańcuch).
        Dla dnia `OPEN` pole jest puste.
      responses:
        "200":
          description: Bieżący dzień
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentBusinessDay"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /business-days:close:
    post:
      tags: [admin]
      operationId: closeBusinessDay
      x-roles: [ADMIN]
      summary: Wyzwolenie zamknięcia dnia (EOD)
      description: |
        Uruchamia łańcuch EOD (`docs/business-rules.md` §6) i zwraca `202` z przebiegiem orkiestratora; UI odpytuje
        `GET /jobs/{id}` do statusu terminalnego.
        - Dzień `OPEN`: `OPEN → CLOSING`, nowy przebieg `jobName = eod` (`businessDate` = zamykany dzień). Jego `steps`
          to osobne przebiegi z `parentRunId`: `eod.expire-confirmations`, `eod.standing-orders`, `eod.accrual`,
          `eod.capitalization`, `eod.snapshots` (przejścia stanów dnia wykonuje orkiestrator bez osobnego przebiegu).
        - Dzień `CLOSING` z przebiegiem `RUNNING` → `409` `conflict` (`extensions.jobRunId`).
        - Dzień `CLOSING` z ostatnim przebiegiem `FAILED` → wznowienie: nowy przebieg `eod` z `resumesRunId` = nieudany,
          kroki już `SUCCEEDED` dla tej daty są pomijane (są idempotentne), start od nieudanego kroku (`202`);
          `closingJobRunId` dnia wskazuje nowy przebieg. Scheduler nigdy nie wznawia — tylko ADMIN.
        - `times > 1` (przewijanie dev/test) tylko gdy `fastForwardAllowed` (`bank.allow-fast-forward=true`), inaczej
          `403` `forbidden`. Odpowiedź to jeden przebieg nadrzędny `jobName = eod.fast-forward` (`businessDate` = pierwszy
          zamykany dzień), którego `steps` to kolejne przebiegi `eod` (jeden na dzień, każdy z własnymi krokami); status
          terminalny po ostatnim dniu, `FAILED` zatrzymuje przewijanie na dniu, który zawiódł.
        Nigdy nie naprawia uzgodnienia automatycznie: niepowodzenie zostawia dzień w `CLOSING` i przebieg `FAILED`
        z `reconciliation` opisującym, co się nie zgadza.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: times
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 400, default: 1 }
          description: Liczba dni roboczych do zamknięcia po kolei (dev/test)
      responses:
        "202":
          description: EOD uruchomiony
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRun"
        "200":
          description: Powtórzone żądanie — ten sam przebieg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRun"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── admin: zadania batch ─────────────────────────────

  /jobs:
    get:
      tags: [admin]
      operationId: listJobRuns
      x-roles: [ADMIN]
      summary: Przebiegi zadań batch
      description: Porządek `startedAt` malejąco. Lista zawiera orkiestratory i ich kroki (filtruj `parentRunId`); `steps` jest wypełniane tylko w `GET /jobs/{id}` i w odpowiedzi `202` na EOD.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: jobName
          in: query
          required: false
          schema: { type: string }
        - name: businessDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobRunStatus"
        - name: parentRunId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Kroki jednego przebiegu EOD
      responses:
        "200":
          description: Strona przebiegów, od najnowszego
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRunPage"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /jobs/{jobRunId}:
    parameters:
      - $ref: "#/components/parameters/JobRunId"
    get:
      tags: [admin]
      operationId: getJobRun
      x-roles: [ADMIN]
      summary: Przebieg zadania
      description: Dla orkiestratora EOD `steps` zawiera kroki łańcucha w kolejności wykonania.
      responses:
        "200":
          description: Przebieg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRun"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token z Keycloak (realm `bank`). Role w `realm_access.roles`.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID, unikalny per wywołującego (`sub`) przez 24 h. Odcisk żądania = metoda + ścieżka + SHA-256 znormalizowanego
        ciała. Zapisywana jest wyłącznie odpowiedź 2xx (status + ciało); powtórzenie z tym samym kluczem i odciskiem
        zwraca zapisane ciało (snapshot z chwili pierwszej odpowiedzi, nie bieżący stan) ze statusem `200` dla
        oryginalnych `201`/`202` i `204` dla oryginalnego `204`. Ten sam klucz z innym odciskiem → `409` `duplicate-request`.
        Odpowiedź 4xx/5xx nie konsumuje klucza — można powtórzyć. Kontrola idempotencji poprzedza kontrolę stanu.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Nieprzezroczysty kursor z `nextCursor` poprzedniej strony (koduje klucze sortowania ostatniego elementu i filtry).
        Brak = pierwsza strona. Kursor niepasujący do bieżących filtrów lub uszkodzony → `400` `validation`.
        Porządek każdej listy jest podany w jej opisie; tie-break zawsze `id` malejąco (UUID v7 jest uporządkowany czasowo).
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Rozmiar strony (domyślnie 20, maks. 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StandingOrderId:
      name: standingOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HoldId:
      name: holdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GlAccountCode:
      name: code
      in: path
      required: true
      description: |
        Kod konta GL w formie kanonicznej: `NNNN` albo `NNNN-<uuid małymi literami>` (subkonto klienta `2000-<accountId>`).
        Ścieżka niepasująca do wzorca → `400` `validation`; pasująca, a nieistniejąca → `404`.
      schema:
        type: string
        pattern: "^[0-9]{4}(-[0-9a-f-]{36})?$"
    RateScheduleId:
      name: rateScheduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobRunId:
      name: jobRunId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Validation:
      description: Błąd walidacji żądania (`type` = `validation`, pole `errors`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Brak lub nieważny token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "Brak roli albo operacja niedozwolona polityką/konfiguracją serwera (`type` = `forbidden`; szczegół w `detail`)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Zasób nie istnieje albo nie należy do klienta (`type` = `not-found`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "`conflict` (wersja / stan) albo `duplicate-request` (ten sam `Idempotency-Key`, inne ciało)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Money:
      type: object
      description: Kwota w jednostkach mniejszych (grosze) + kod ISO 4217. Nigdy liczby zmiennoprzecinkowe.
      required: [minor, currency]
      properties:
        minor:
          type: integer
          format: int64
          description: Kwota w groszach; znak zależy od kontekstu pola (opisany przy polu).
          examples: [12345]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Kod ISO 4217
          examples: [PLN]

    Problem:
      type: object
      description: RFC 7807. `type` to `https://bank.local/problems/<slug>`; slugi w `docs/integration-contracts.md` §3.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://bank.local/problems/insufficient-funds"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Ścieżka żądania
        correlationId:
          type: string
          format: uuid
          description: Id korelacji żądania — UI pokazuje go przy nieznanych błędach
        errors:
          type: array
          description: Tylko dla `validation`
          items:
            $ref: "#/components/schemas/FieldError"
        extensions:
          type: object
          description: |
            Pola specyficzne dla slugu. Kwoty w `extensions` zawsze jako `Money` (`{minor,currency}`), nigdy gołe liczby.
            Znane: `available` (`insufficient-funds`), `attemptsLeft` (`confirmation-failed`), `jobRunId` (`conflict` przy EOD),
            `balance` (`conflict` przy zamykaniu rachunku z saldem ≠ 0).
          properties:
            available:
              $ref: "#/components/schemas/Money"
            balance:
              $ref: "#/components/schemas/Money"
            attemptsLeft:
              type: integer
              minimum: 0
            jobRunId:
              type: string
              format: uuid
          additionalProperties: true

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Ścieżka pola w ciele żądania (np. `amount.minor`)
        message:
          type: string

    Customer:
      type: object
      required: [id, email, fullName, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        status:
          $ref: "#/components/schemas/CustomerStatus"
        createdAt: { type: string, format: date-time }

    CustomerStatus:
      type: string
      enum: [ACTIVE, BLOCKED, CLOSED]

    ProductKind:
      type: string
      enum: [CURRENT, SAVINGS]

    AccountStatus:
      type: string
      description: "`ACTIVE ⇄ BLOCKED` (operator), `ACTIVE → CLOSED`. Na `BLOCKED` dozwolone tylko uznania."
      enum: [ACTIVE, BLOCKED, CLOSED]

    Account:
      type: object
      required: [id, iban, productCode, productName, productKind, currency, status, balance, availableBalance, openedOn, version]
      properties:
        id: { type: string, format: uuid }
        iban:
          type: string
          description: 28 znaków, `PL` + 26-cyfrowy NRB
          examples: [PL61100000000000000000000001]
        productCode: { type: string, examples: [CURRENT_STD] }
        productName: { type: string, examples: ["Konto osobiste"] }
        productKind:
          $ref: "#/components/schemas/ProductKind"
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        status:
          $ref: "#/components/schemas/AccountStatus"
        balance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Saldo księgowe z perspektywy klienta (dodatnie = środki klienta)
        availableBalance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "`balance − aktywne blokady (+ limit debetu, jeśli produkt pozwala)`"
        holdsTotal:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Suma aktywnych blokad (≥ 0)
        openedOn: { type: string, format: date }
        closedOn: { type: string, format: date }
        version:
          type: integer
          format: int64
          description: Wersja agregatu (optymistyczne blokowanie)

    AccountPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        nextCursor:
          type: [string, "null"]

    TransactionType:
      type: string
      description: Typ zapisu księgowego, z którego pochodzi pozycja
      enum: [TRANSFER, TRANSFER_OUT, TRANSFER_IN, REVERSAL, CAPITALIZATION, MANUAL, FEE]

    Transaction:
      type: object
      description: Pozycja historii rachunku wyprowadzona z jednego postingu na subkoncie GL rachunku.
      required: [id, entryId, entryReference, type, bookingDate, valueDate, amount, balanceAfter]
      properties:
        id:
          type: string
          format: uuid
          description: Id postingu
        entryId:
          type: string
          format: uuid
          description: Id zapisu księgowego
        entryReference:
          type: string
          description: Referencja dla ludzi (`JE-<sekwencja>`)
          examples: [JE-1042]
        type:
          $ref: "#/components/schemas/TransactionType"
        bookingDate: { type: string, format: date }
        valueDate: { type: string, format: date }
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Ze znakiem z perspektywy klienta — dodatni = uznanie, ujemny = obciążenie
        balanceAfter:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Saldo księgowe rachunku po tej pozycji
        counterpartyIban:
          type: string
          description: IBAN drugiej strony (jeśli dotyczy)
        counterpartyName:
          type: string
        title:
          type: string
        paymentId:
          type: string
          format: uuid
          description: Płatność, z której wynika pozycja (jeśli dotyczy)
        reversalOfEntryId:
          type: string
          format: uuid
          description: Dla `REVERSAL` — stornowany zapis

    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        nextCursor:
          type: [string, "null"]

    PaymentKind:
      type: string
      enum: [INTERNAL, EXTERNAL_OUT, EXTERNAL_IN]

    PaymentStatus:
      type: string
      description: |
        `CREATED → PENDING_CONFIRMATION → POSTED → SETTLED`; `→ REJECTED` (walidacja, wygasły kod);
        `POSTED → RETURNED` (zwrot z izby lub operatora). Terminalne: `SETTLED`, `REJECTED`, `RETURNED`.
      enum: [CREATED, PENDING_CONFIRMATION, POSTED, SETTLED, REJECTED, RETURNED]

    Payment:
      type: object
      required: [id, reference, kind, status, debtorIban, creditorIban, creditorName, amount, title, requestedDate, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        reference:
          type: string
          description: "`PAY-<yyyymmdd>-<6 base32>`"
          examples: [PAY-20260908-7K3M2Q]
        kind:
          $ref: "#/components/schemas/PaymentKind"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        debtorAccountId:
          type: string
          format: uuid
          description: Rachunek klienta obciążany (brak dla `EXTERNAL_IN`)
        creditorAccountId:
          type: string
          format: uuid
          description: Rachunek klienta uznawany (dla `INTERNAL` i `EXTERNAL_IN`, jeśli należy do tego klienta)
        debtorIban: { type: string }
        debtorName: { type: string }
        creditorIban: { type: string }
        creditorName: { type: string }
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Zawsze dodatnia
        title: { type: string }
        requestedDate:
          type: string
          format: date
          description: Data biznesowa zlecenia
        reasonCode:
          type: string
          description: Dla `REJECTED`/`RETURNED` — kod ISO 20022 (`AC01`, `AC04`, `AM04`, `MS03`) lub slug odrzucenia
        clearingRef:
          type: string
          description: Referencja izby dla płatności zewnętrznych po rozliczeniu
        confirmation:
          $ref: "#/components/schemas/PaymentConfirmationInfo"
        createdAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time }
        version:
          type: integer
          format: int64

    PaymentConfirmationInfo:
      type: object
      description: Obecne tylko w stanie `PENDING_CONFIRMATION`
      required: [expiresAt, attemptsLeft]
      properties:
        expiresAt: { type: string, format: date-time }
        attemptsLeft:
          type: integer
          minimum: 0

    PaymentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        nextCursor:
          type: [string, "null"]

    CreatePaymentRequest:
      type: object
      required: [debtorAccountId, creditorIban, creditorName, amount, title]
      properties:
        debtorAccountId:
          type: string
          format: uuid
          description: Własny rachunek klienta
        creditorIban:
          type: string
          minLength: 15
          maxLength: 34
          description: IBAN odbiorcy (bez spacji). Walidacja mod 97 po stronie serwera (`invalid-iban`).
        creditorName:
          type: string
          minLength: 1
          maxLength: 140
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Dodatnia; min 1 grosz, maks. 100 000,00 PLN (`limit-exceeded`)
        title:
          type: string
          minLength: 1
          maxLength: 140

    ConfirmPaymentRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6-cyfrowy kod z e-maila

    StandingOrderFrequency:
      type: string
      enum: [WEEKLY, MONTHLY]

    StandingOrderStatus:
      type: string
      enum: [ACTIVE, CANCELLED]

    StandingOrder:
      type: object
      required: [id, debtorAccountId, creditorIban, creditorName, amount, title, frequency, dayOfPeriod, nextRunDate, status, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        debtorAccountId: { type: string, format: uuid }
        creditorIban: { type: string }
        creditorName: { type: string }
        amount:
          $ref: "#/components/schemas/Money"
        title: { type: string }
        frequency:
          $ref: "#/components/schemas/StandingOrderFrequency"
        dayOfPeriod:
          type: integer
          description: "`WEEKLY`: 1–7 (pon–ndz); `MONTHLY`: 1–28"
          minimum: 1
          maximum: 28
        nextRunDate:
          type: string
          format: date
          description: Następna data wykonania (już przesunięta na dzień roboczy, jeśli trzeba)
        lastRunDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/StandingOrderStatus"
        createdAt: { type: string, format: date-time }
        version:
          type: integer
          format: int64

    StandingOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StandingOrder"
        nextCursor:
          type: [string, "null"]

    StandingOrderRequest:
      type: object
      required: [debtorAccountId, creditorIban, creditorName, amount, title, frequency, dayOfPeriod]
      properties:
        debtorAccountId: { type: string, format: uuid }
        creditorIban:
          type: string
          minLength: 15
          maxLength: 34
        creditorName:
          type: string
          minLength: 1
          maxLength: 140
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Dodatnia; te same limity co pojedyncza płatność
        title:
          type: string
          minLength: 1
          maxLength: 140
        frequency:
          $ref: "#/components/schemas/StandingOrderFrequency"
        dayOfPeriod:
          type: integer
          minimum: 1
          maximum: 28
        startDate:
          type: string
          format: date
          description: Najwcześniejsza data pierwszego wykonania; brak = pierwszy pasujący dzień po dzisiejszej dacie biznesowej

    UpdateStandingOrderRequest:
      allOf:
        - $ref: "#/components/schemas/StandingOrderRequest"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              description: Wersja z ostatnio odczytanego zlecenia; niezgodna → `409` `conflict`

    # ───────────────────────────── operator / admin ─────────────────────────────

    Capitalization:
      type: string
      enum: [MONTHLY, QUARTERLY, NONE]

    Product:
      type: object
      description: Definicja typu rachunku (`docs/domain-model.md` §3 `product`).
      required: [code, name, kind, allowsDebit, allowsOverdraft, capitalization, currency]
      properties:
        code: { type: string, examples: [CURRENT_STD] }
        name: { type: string, examples: ["Konto osobiste"] }
        kind:
          $ref: "#/components/schemas/ProductKind"
        allowsDebit:
          type: boolean
          description: Czy z rachunku można zlecać obciążenia (przelewy)
        allowsOverdraft:
          type: boolean
        overdraftLimit:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Limit debetu, gdy `allowsOverdraft` (≥ 0)
        capitalization:
          $ref: "#/components/schemas/Capitalization"
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        defaultRateScheduleId:
          type: string
          format: uuid
          description: |
            Harmonogram bazowy produktu (seed). Stopa NIE jest przypinana do rachunku: dla każdego dnia naliczenia
            obowiązuje harmonogram produktu o największym `effectiveFrom ≤ businessDate` (`docs/business-rules.md` §7).

    ProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        nextCursor:
          type: [string, "null"]

    OperatorCustomer:
      description: Klient w widoku operatora — `Customer` plus identyfikator Keycloak i wersja.
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required: [keycloakSub, version, accountsCount]
          properties:
            keycloakSub:
              type: string
              description: Claim `sub` użytkownika w realmie `bank` (1:1)
            accountsCount:
              type: integer
              minimum: 0
              description: Liczba rachunków niezamkniętych
            version:
              type: integer
              format: int64
            updatedAt: { type: string, format: date-time }

    CustomerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperatorCustomer"
        nextCursor:
          type: [string, "null"]

    CreateCustomerRequest:
      type: object
      required: [keycloakSub, email, fullName]
      properties:
        keycloakSub:
          type: string
          minLength: 1
          maxLength: 255
          description: "`sub` istniejącego użytkownika Keycloak — pole *ID* użytkownika w Admin Console (realm `bank` → Users)"
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 1
          maxLength: 140

    UpdateCustomerRequest:
      type: object
      description: Pola pominięte pozostają bez zmian. `version` obowiązkowa.
      required: [version]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 1
          maxLength: 140
        status:
          $ref: "#/components/schemas/CustomerStatus"
        reason:
          type: string
          maxLength: 280
          description: Wymagany przy zmianie `status` (`400` `validation` bez niego); trafia do audytu
        version:
          type: integer
          format: int64

    OperatorAccount:
      description: Rachunek w widoku operatora — `Account` plus właściciel i konto GL.
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [customerId, glAccountCode]
          properties:
            customerId: { type: string, format: uuid }
            glAccountCode:
              type: string
              description: Subkonto GL rachunku (`2000-<accountId>`)
            overdraftLimit:
              allOf:
                - $ref: "#/components/schemas/Money"
              description: Limit debetu produktu, jeśli dotyczy
            accruedInterest:
              allOf:
                - $ref: "#/components/schemas/Money"
              description: Naliczone, nieskapitalizowane odsetki (Σ `accrual_daily` od ostatniej kapitalizacji, ≥ 0) — kwota, którą zaksięguje kapitalizacja przy zamknięciu

    OperatorAccountPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperatorAccount"
        nextCursor:
          type: [string, "null"]

    OpenAccountRequest:
      type: object
      required: [productCode]
      properties:
        productCode:
          type: string
          minLength: 1

    AccountStatusChangeRequest:
      type: object
      required: [status, reason, version]
      properties:
        status:
          $ref: "#/components/schemas/AccountStatus"
        reason:
          type: string
          minLength: 1
          maxLength: 280
          description: Powód (audyt)
        version:
          type: integer
          format: int64

    HoldStatus:
      type: string
      enum: [ACTIVE, RELEASED]

    HoldReferenceType:
      type: string
      description: "`PAYMENT` — blokada cyklu życia płatności; `MANUAL` — założona przez operatora"
      enum: [PAYMENT, MANUAL]

    Hold:
      type: object
      required: [id, accountId, amount, reason, referenceType, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Zawsze dodatnia
        reason: { type: string }
        referenceType:
          $ref: "#/components/schemas/HoldReferenceType"
        referenceId:
          type: string
          format: uuid
          description: Id płatności dla `PAYMENT`
        status:
          $ref: "#/components/schemas/HoldStatus"
        createdBy:
          type: string
          description: "`sub` operatora dla `MANUAL`"
        createdAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }

    HoldPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Hold"
        nextCursor:
          type: [string, "null"]

    CreateHoldRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Dodatnia, w walucie rachunku
        reason:
          type: string
          minLength: 1
          maxLength: 280

    OperatorPayment:
      description: Płatność w widoku operatora — `Payment` plus identyfikatory księgowe i właścicieli.
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          properties:
            debtorCustomerId: { type: string, format: uuid }
            creditorCustomerId: { type: string, format: uuid }
            holdId:
              type: string
              format: uuid
              description: Blokada środków (od `PENDING_CONFIRMATION` do `POSTED`/`REJECTED`)
            entryId:
              type: string
              format: uuid
              description: Zapis księgowy księgowania (`POSTED`)
            reversalEntryId:
              type: string
              format: uuid
              description: Zapis storna (`RETURNED`)
            returnedBy:
              type: string
              description: "`sub` operatora przy ręcznym zwrocie; brak = zwrot z izby"
            updatedAt: { type: string, format: date-time }

    OperatorPaymentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperatorPayment"
        nextCursor:
          type: [string, "null"]

    ReturnReasonCode:
      type: string
      description: Podzbiór ISO 20022 (`docs/integration-contracts.md` §4). `AM04` nie jest emitowany przez bank.
      enum: [AC01, AC04, MS03]

    ReturnPaymentRequest:
      type: object
      required: [reasonCode, reason]
      properties:
        reasonCode:
          $ref: "#/components/schemas/ReturnReasonCode"
        reason:
          type: string
          minLength: 1
          maxLength: 280
          description: Uzasadnienie operatora (audyt)
        version:
          type: integer
          format: int64
          description: Wersja z ostatnio odczytanej płatności (`OperatorPayment.version`); jeśli podana i niezgodna → `409` `conflict`

    GlAccountType:
      type: string
      description: Typ konta z planu kont (`docs/domain-model.md` §2). `TECHNICAL` = konto techniczne `9000`.
      enum: [ASSET, LIABILITY, INCOME, EXPENSE, TECHNICAL]

    GlAccount:
      type: object
      required: [code, name, type, balance, balanceDate]
      properties:
        code:
          type: string
          examples: ["2100", "2000-0191f7a0-1111-7000-8000-000000000001"]
        name: { type: string }
        type:
          $ref: "#/components/schemas/GlAccountType"
        parentCode:
          type: string
          description: Konto nadrzędne (np. `2000` dla subkont klientów)
        customerAccountId:
          type: string
          format: uuid
          description: Dla subkont `2000-*` — rachunek klienta
        balance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            Σ postingów z `businessDate ≤ balanceDate` na tym koncie i na wszystkich jego potomkach (roll-up po `parentCode`),
            ze znakiem — dodatnie = Wn, ujemne = Ma. Konta-liście (np. `2000-<accountId>`, `2100`) mają tylko postingi własne;
            konto kontrolne `2000` = Σ subkont klientów (uzgodnienie `docs/business-rules.md` §6).
        balanceDate:
          type: string
          format: date
          description: Data biznesowa, na którą liczone jest saldo (bieżący dzień)
        postingsCount:
          type: integer
          format: int64
          minimum: 0
          description: Liczba postingów do `balanceDate` włącznie (dla konta nadrzędnego — roll-up po potomkach)

    GlAccountPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GlAccount"
        nextCursor:
          type: [string, "null"]

    JournalEntryType:
      type: string
      description: Typy zapisów (`docs/business-rules.md` §4, §7–9). `TransactionType` historii klienta jest podzbiorem.
      enum: [TRANSFER, TRANSFER_OUT, TRANSFER_IN, REVERSAL, INTEREST_ACCRUAL, OVERDRAFT_ACCRUAL, CAPITALIZATION, MANUAL, FEE]

    Posting:
      type: object
      required: [id, glAccountCode, amount]
      properties:
        id: { type: string, format: uuid }
        glAccountCode: { type: string }
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Ze znakiem — dodatnia = debet (Wn), ujemna = kredyt (Ma). Jedna kolumna, bez flagi dr/cr.

    JournalEntry:
      type: object
      description: Zapis księgowy z postingami sumującymi się do zera. Append-only; korekta = `REVERSAL`.
      required: [id, reference, type, bookingDate, valueDate, businessDate, postings, createdAt]
      properties:
        id: { type: string, format: uuid }
        reference:
          type: string
          description: "`JE-<sekwencja>`"
          examples: [JE-1042]
        type:
          $ref: "#/components/schemas/JournalEntryType"
        bookingDate: { type: string, format: date }
        valueDate: { type: string, format: date }
        businessDate: { type: string, format: date }
        description: { type: string }
        referenceType:
          type: string
          description: Rodzaj obiektu źródłowego (`PAYMENT`, `ACCRUAL_DAILY`, `CAPITALIZATION_RUN`, `MANUAL`, …)
        referenceId:
          type: string
          description: Id obiektu źródłowego
        reversalOfEntryId:
          type: string
          format: uuid
          description: Dla `REVERSAL` — stornowany zapis (nazwa jak `Transaction.reversalOfEntryId`)
        reversedByEntryId:
          type: string
          format: uuid
          description: Zapis storna, jeśli ten zapis został wystornowany (zapis ma co najwyżej jedno storno)
        postedBy:
          type: string
          description: "`sub` operatora dla `MANUAL`/`REVERSAL` ręcznego; brak = system"
        postings:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Posting"
        createdAt: { type: string, format: date-time }

    JournalEntryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        nextCursor:
          type: [string, "null"]

    ReverseEntryRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 280

    PostingRequest:
      type: object
      required: [glAccountCode, amount]
      properties:
        glAccountCode:
          type: string
          pattern: "^[0-9]{4}(-[0-9a-fA-F-]{36})?$"
          description: Kod konta GL; część UUID porównywana po normalizacji do małych liter
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Ze znakiem (dodatnia = Wn, ujemna = Ma), niezerowa

    ManualEntryRequest:
      type: object
      required: [description, reason, postings]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 280
          description: Opis zapisu widoczny w księdze
        reason:
          type: string
          minLength: 1
          maxLength: 280
          description: Uzasadnienie dla audytu (obowiązkowe; szczególnie przy `2000-*`)
        valueDate:
          type: string
          format: date
          description: Domyślnie = data księgowania
        postings:
          type: array
          minItems: 2
          maxItems: 50
          items:
            $ref: "#/components/schemas/PostingRequest"

    DayCount:
      type: string
      enum: [ACT_365]

    RateTier:
      type: object
      description: "Próg marginalny — stopa dla części salda do `upToMinor`; ostatni próg ma `upToMinor: null`."
      required: [upToMinor, annualRateBp]
      properties:
        upToMinor:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Górna granica progu w jednostkach mniejszych waluty produktu (`Product.currency`, dziś PLN); `null` = bez górnej granicy
        annualRateBp:
          type: integer
          minimum: 0
          maximum: 100000
          description: Stopa roczna w punktach bazowych (500 = 5,00 %)

    RateScheduleStatus:
      type: string
      description: Wyliczany przy odczycie względem bieżącej daty biznesowej (nie przechowywany).
      enum: [SCHEDULED, IN_FORCE, SUPERSEDED]

    RateSchedule:
      type: object
      required: [id, productCode, effectiveFrom, tiers, dayCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        productCode: { type: string }
        effectiveFrom: { type: string, format: date }
        tiers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RateTier"
        dayCount:
          $ref: "#/components/schemas/DayCount"
        effectiveTo:
          type: [string, "null"]
          format: date
          description: Dzień przed `effectiveFrom` następnego harmonogramu produktu; `null` = bez końca
        status:
          $ref: "#/components/schemas/RateScheduleStatus"
        createdBy:
          type: string
          description: "`sub` administratora; brak = seed"
        createdAt: { type: string, format: date-time }

    RateSchedulePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RateSchedule"
        nextCursor:
          type: [string, "null"]

    CreateRateScheduleRequest:
      type: object
      required: [productCode, effectiveFrom, tiers]
      properties:
        productCode: { type: string, minLength: 1 }
        effectiveFrom:
          type: string
          format: date
          description: Nie wcześniej niż następna data biznesowa
        tiers:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/RateTier"
        dayCount:
          allOf:
            - $ref: "#/components/schemas/DayCount"
          default: ACT_365

    BusinessDayStatus:
      type: string
      description: |
        `PLANNED → OPEN → CLOSING → CLOSED` dla dni roboczych. Dni nierobocze (sb/nd/święta) nigdy nie są `OPEN`:
        przechodzą `PLANNED → CLOSED` w tej samej transakcji EOD, która je pomija (`closedAt` ustawione, `openedAt` puste).
      enum: [PLANNED, OPEN, CLOSING, CLOSED]

    BusinessDay:
      type: object
      required: [date, businessDay, status]
      properties:
        date: { type: string, format: date }
        businessDay:
          type: boolean
          description: Czy to dzień roboczy (pn–pt bez polskich świąt państwowych); dni nierobocze nigdy nie są `OPEN`
        status:
          $ref: "#/components/schemas/BusinessDayStatus"
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        closingJobRunId:
          type: string
          format: uuid
          description: Najnowszy przebieg orkiestratora EOD tego dnia (trwający, nieudany albo ten, który zamknął dzień)

    BusinessDayPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BusinessDay"
        nextCursor:
          type: [string, "null"]

    CurrentBusinessDay:
      allOf:
        - $ref: "#/components/schemas/BusinessDay"
        - type: object
          required: [nextBusinessDate, fastForwardAllowed]
          properties:
            previousBusinessDate: { type: string, format: date }
            nextBusinessDate:
              type: string
              format: date
              description: Dzień, który stanie się `OPEN` po EOD
            fastForwardAllowed:
              type: boolean
              description: Czy `POST /business-days:close?times>1` jest dozwolony (`bank.allow-fast-forward`)

    JobRunStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED]

    JobRun:
      type: object
      description: Przebieg zadania batch (`docs/domain-model.md` §3 `job_run`). Orkiestrator EOD ma `steps`.
      required: [id, jobName, businessDate, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        jobName:
          type: string
          examples: [eod, eod.fast-forward, eod.expire-confirmations, eod.standing-orders, eod.accrual, eod.capitalization, eod.snapshots, outbox-relay]
        businessDate: { type: string, format: date }
        status:
          $ref: "#/components/schemas/JobRunStatus"
        parentRunId:
          type: string
          format: uuid
          description: Dla kroków EOD — przebieg orkiestratora
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        itemsProcessed:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
          description: Komunikat błędu dla `FAILED` (bez PII)
        triggeredBy:
          type: string
          description: "`sub` administratora albo `scheduler`"
        resumesRunId:
          type: string
          format: uuid
          description: Dla wznowionego orkiestratora EOD — poprzedni przebieg `FAILED` tej samej `businessDate`
        reconciliation:
          allOf:
            - $ref: "#/components/schemas/ReconciliationResult"
          description: Wynik uzgodnienia kroku `eod.snapshots` (kopiowany też na orkiestrator); brak dla innych zadań
        steps:
          type: array
          description: Tylko dla orkiestratora (`eod`, `eod.fast-forward`) w `GET /jobs/{id}` i odpowiedzi `202` — kroki w kolejności wykonania
          items:
            $ref: "#/components/schemas/JobRun"

    JobRunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobRun"
        nextCursor:
          type: [string, "null"]

    ReconciliationCheckCode:
      type: string
      description: Kontrole z `docs/business-rules.md` §6 pkt 6
      enum: [GL_INVARIANT, UNASSIGNED_INCOMING_ZERO, SUSPENSE_ZERO, CUSTOMER_CONTROL]

    ReconciliationCheck:
      type: object
      required: [code, passed, difference]
      properties:
        code:
          $ref: "#/components/schemas/ReconciliationCheckCode"
        glAccountCode:
          type: string
          description: Konto, którego dotyczy kontrola (`2300`, `9000`, `2000`), jeśli dotyczy
        passed:
          type: boolean
        difference:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Różnica ze znakiem; `0` gdy `passed`

    ReconciliationResult:
      type: object
      description: Wynik uzgodnienia EOD. `passed = false` → dzień zostaje `CLOSING`, przebieg `FAILED`.
      required: [passed, checks]
      properties:
        passed:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationCheck"
