    paymentSettled:
      name: "payment.settled"
      title: "payment.settled"
      summary: "Izba rozliczyła płatność zewnętrzną (albo wewnętrzna rozliczona natychmiast)."
      description: "Izba rozliczyła płatność zewnętrzną (albo wewnętrzna rozliczona natychmiast). Konsumenci: notifications."
