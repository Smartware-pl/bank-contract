      title: "payment.confirmation_requested"
      summary: "Płatność czeka na kod potwierdzenia."
      description: "Płatność czeka na kod potwierdzenia. Jedyny payload z sekretem (`code` jawny) — core-api trzyma wyłącznie hash; konsument nie loguje payloadu. Konsumenci: notifications."
