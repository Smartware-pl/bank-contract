      name: "payment.posted"
      title: "payment.posted"
      summary: "Płatność zaksięgowana."
      description: "Płatność zaksięgowana. notifications → mail; clearing-sim → dla `external=true` i `kind=EXTERNAL_OUT` publikuje po opóźnieniu `clearing.settled` albo `clearing.returned`. Konsumenci: notifications, clearing-sim."
      contentType: "application/json"
      headers:
        "$ref": "./schemas/kafka-headers.json"
      payload:
        "$ref": "./schemas/events/payment.posted.json"
      examples:
        - name: "przykład"
          payload:
            "$ref": "./examples/payment.posted.json"
    paymentRejected:
      name: "payment.rejected"
      title: "payment.rejected"
      summary: "Płatność odrzucona (walidacja, wygasły kod, brak środków przy zleceniu stałym)."
      description: "Płatność odrzucona (walidacja, wygasły kod, brak środków przy zleceniu stałym). Konsumenci: notifications."
      contentType: "application/json"
      headers:
        "$ref": "./schemas/kafka-headers.json"
