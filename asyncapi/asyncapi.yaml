# Generowane ze skryptu w PR (asyncapi/README.md); edytuj świadomie — schematy w schemas/ są normatywne.
asyncapi: "3.0.0"
id: "urn:bank:event-bus"
info:
  title: "bank event bus"
  version: "0.3.0"
  description: "Normatywny opis szyny zdarzeń (Redpanda, Kafka API) — docs/integration-contracts.md §4–5. Jedna koperta dla wszystkich zdarzeń (schemas/envelope.json), schemat payloadu per `type` (schemas/payloads/), pełny schemat zdarzenia (schemas/events/) używany w testach kontraktowych obu stron. Przez szynę idą wyłącznie fakty w czasie przeszłym; żadnych komend ani request-reply. Zmiany kompatybilne = nowe opcjonalne pole albo nowy `type`; niekompatybilne = `version`+1. Historia: v0.3 (2026-09-10) pierwsza wersja — 14 zdarzeń, 6 tematów; pola `email`/`customerId`/`amount` w `payment.*` i `interest.capitalized` dla notifications."
  contact:
    name: "bank-contract (CODEOWNERS)"
defaultContentType: "application/json"
servers:
  redpanda-dev:
    host: "redpanda:9092"
    protocol: "kafka"
    description: "Broker w docker-compose bank-infra (z hosta localhost:19092). Tematy tworzy bank-infra (`make topics`), nie aplikacje."
channels:
  customers:
    address: "bank.customers.v1"
    description: "Temat `bank.customers.v1`. Producent: core-api. Konsumenci: notifications. Klucz wiadomości = aggregateId. Retencja dev 7 dni. DLQ: `bank.customers.v1.dlq`."
    messages:
      customerCreated:
        "$ref": "#/components/messages/customerCreated"
    bindings:
      kafka:
        topic: "bank.customers.v1"
        partitions: 1
        topicConfiguration:
          retention.ms: 604800000
          cleanup.policy:
            - "delete"
        bindingVersion: "0.5.0"
  accounts:
    address: "bank.accounts.v1"
    description: "Temat `bank.accounts.v1`. Producent: core-api. Konsumenci: notifications. Klucz wiadomości = aggregateId. Retencja dev 7 dni. DLQ: `bank.accounts.v1.dlq`."
    messages:
      accountOpened:
        "$ref": "#/components/messages/accountOpened"
    bindings:
      kafka:
        topic: "bank.accounts.v1"
        partitions: 1
        topicConfiguration:
          retention.ms: 604800000
          cleanup.policy:
            - "delete"
        bindingVersion: "0.5.0"
  payments:
    address: "bank.payments.v1"
    description: "Temat `bank.payments.v1`. Producent: core-api. Konsumenci: notifications, clearing-sim. Klucz wiadomości = aggregateId. Retencja dev 7 dni. DLQ: `bank.payments.v1.dlq`."
    messages:
      paymentConfirmationRequested:
        "$ref": "#/components/messages/paymentConfirmationRequested"
      paymentPosted:
        "$ref": "#/components/messages/paymentPosted"
      paymentRejected:
        "$ref": "#/components/messages/paymentRejected"
      paymentSettled:
        "$ref": "#/components/messages/paymentSettled"
      paymentReturned:
        "$ref": "#/components/messages/paymentReturned"
      paymentIncomingCredited:
        "$ref": "#/components/messages/paymentIncomingCredited"
      paymentIncomingRejected:
        "$ref": "#/components/messages/paymentIncomingRejected"
    bindings:
      kafka:
        topic: "bank.payments.v1"
        partitions: 1
        topicConfiguration:
          retention.ms: 604800000
          cleanup.policy:
            - "delete"
        bindingVersion: "0.5.0"
  interest:
    address: "bank.interest.v1"
    description: "Temat `bank.interest.v1`. Producent: core-api. Konsumenci: notifications. Klucz wiadomości = aggregateId. Retencja dev 7 dni. DLQ: `bank.interest.v1.dlq`."
    messages:
      interestCapitalized:
        "$ref": "#/components/messages/interestCapitalized"
    bindings:
      kafka:
        topic: "bank.interest.v1"
        partitions: 1
        topicConfiguration:
          retention.ms: 604800000
          cleanup.policy:
            - "delete"
        bindingVersion: "0.5.0"
  batch:
    address: "bank.batch.v1"
    description: "Temat `bank.batch.v1`. Producent: core-api. Konsumenci: brak (obserwacja). Klucz wiadomości = aggregateId. Retencja dev 7 dni. DLQ: `bank.batch.v1.dlq`."
    messages:
      businessdayClosed:
        "$ref": "#/components/messages/businessdayClosed"
    bindings:
      kafka:
        topic: "bank.batch.v1"
        partitions: 1
        topicConfiguration:
          retention.ms: 604800000
          cleanup.policy:
            - "delete"
        bindingVersion: "0.5.0"
  clearing:
    address: "bank.clearing.v1"
    description: "Temat `bank.clearing.v1`. Producent: clearing-sim. Konsumenci: core-api. Klucz wiadomości = aggregateId. Retencja dev 7 dni. DLQ: `bank.clearing.v1.dlq`."
    messages:
      clearingSettled:
        "$ref": "#/components/messages/clearingSettled"
      clearingReturned:
        "$ref": "#/components/messages/clearingReturned"
      clearingIncomingReceived:
        "$ref": "#/components/messages/clearingIncomingReceived"
    bindings:
      kafka:
        topic: "bank.clearing.v1"
        partitions: 1
        topicConfiguration:
          retention.ms: 604800000
          cleanup.policy:
            - "delete"
        bindingVersion: "0.5.0"
operations:
  core-apiPublishesCustomers:
    action: "send"
    channel:
      "$ref": "#/channels/customers"
    summary: "core-api publikuje na bank.customers.v1 (przez transactional outbox + relay)"
    messages:
      - "$ref": "#/channels/customers/messages/customerCreated"
    bindings:
      kafka:
        bindingVersion: "0.5.0"
  notificationsConsumesCustomers:
    action: "receive"
    channel:
      "$ref": "#/channels/customers"
    summary: "notifications konsumuje bank.customers.v1 (grupa `notifications`, inbox po `id`, nieznane `type` ignoruje, błąd → retry 3× → DLQ)"
    messages:
      - "$ref": "#/channels/customers/messages/customerCreated"
    bindings:
      kafka:
        groupId:
          type: "string"
          enum:
            - "notifications"
        bindingVersion: "0.5.0"
  core-apiPublishesAccounts:
    action: "send"
    channel:
      "$ref": "#/channels/accounts"
    summary: "core-api publikuje na bank.accounts.v1 (przez transactional outbox + relay)"
    messages:
      - "$ref": "#/channels/accounts/messages/accountOpened"
    bindings:
      kafka:
        bindingVersion: "0.5.0"
  notificationsConsumesAccounts:
    action: "receive"
    channel:
      "$ref": "#/channels/accounts"
    summary: "notifications konsumuje bank.accounts.v1 (grupa `notifications`, inbox po `id`, nieznane `type` ignoruje, błąd → retry 3× → DLQ)"
    messages:
      - "$ref": "#/channels/accounts/messages/accountOpened"
    bindings:
      kafka:
        groupId:
          type: "string"
          enum:
            - "notifications"
        bindingVersion: "0.5.0"
  core-apiPublishesPayments:
    action: "send"
    channel:
      "$ref": "#/channels/payments"
    summary: "core-api publikuje na bank.payments.v1 (przez transactional outbox + relay)"
    messages:
      - "$ref": "#/channels/payments/messages/paymentConfirmationRequested"
      - "$ref": "#/channels/payments/messages/paymentPosted"
      - "$ref": "#/channels/payments/messages/paymentRejected"
      - "$ref": "#/channels/payments/messages/paymentSettled"
      - "$ref": "#/channels/payments/messages/paymentReturned"
      - "$ref": "#/channels/payments/messages/paymentIncomingCredited"
      - "$ref": "#/channels/payments/messages/paymentIncomingRejected"
    bindings:
      kafka:
        bindingVersion: "0.5.0"
  notificationsConsumesPayments:
    action: "receive"
    channel:
      "$ref": "#/channels/payments"
    summary: "notifications konsumuje bank.payments.v1 (grupa `notifications`, inbox po `id`, nieznane `type` ignoruje, błąd → retry 3× → DLQ)"
    messages:
      - "$ref": "#/channels/payments/messages/paymentConfirmationRequested"
      - "$ref": "#/channels/payments/messages/paymentPosted"
      - "$ref": "#/channels/payments/messages/paymentRejected"
      - "$ref": "#/channels/payments/messages/paymentSettled"
      - "$ref": "#/channels/payments/messages/paymentReturned"
      - "$ref": "#/channels/payments/messages/paymentIncomingCredited"
    bindings:
      kafka:
        groupId:
          type: "string"
          enum:
            - "notifications"
        bindingVersion: "0.5.0"
  clearing-simConsumesPayments:
    action: "receive"
    channel:
      "$ref": "#/channels/payments"
    summary: "clearing-sim konsumuje bank.payments.v1 (grupa `clearing-sim`, inbox po `id`, nieznane `type` ignoruje, błąd → retry 3× → DLQ)"
    messages:
      - "$ref": "#/channels/payments/messages/paymentPosted"
      - "$ref": "#/channels/payments/messages/paymentIncomingRejected"
    bindings:
      kafka:
        groupId:
          type: "string"
          enum:
            - "clearing-sim"
        bindingVersion: "0.5.0"
  core-apiPublishesInterest:
    action: "send"
    channel:
      "$ref": "#/channels/interest"
    summary: "core-api publikuje na bank.interest.v1 (przez transactional outbox + relay)"
    messages:
      - "$ref": "#/channels/interest/messages/interestCapitalized"
    bindings:
      kafka:
        bindingVersion: "0.5.0"
  notificationsConsumesInterest:
    action: "receive"
    channel:
      "$ref": "#/channels/interest"
    summary: "notifications konsumuje bank.interest.v1 (grupa `notifications`, inbox po `id`, nieznane `type` ignoruje, błąd → retry 3× → DLQ)"
    messages:
      - "$ref": "#/channels/interest/messages/interestCapitalized"
    bindings:
      kafka:
        groupId:
          type: "string"
          enum:
            - "notifications"
        bindingVersion: "0.5.0"
  core-apiPublishesBatch:
    action: "send"
    channel:
      "$ref": "#/channels/batch"
    summary: "core-api publikuje na bank.batch.v1 (przez transactional outbox + relay)"
    messages:
      - "$ref": "#/channels/batch/messages/businessdayClosed"
    bindings:
      kafka:
        bindingVersion: "0.5.0"
  clearing-simPublishesClearing:
    action: "send"
    channel:
      "$ref": "#/channels/clearing"
    summary: "clearing-sim publikuje na bank.clearing.v1 (bezpośrednio, acks=all)"
    messages:
      - "$ref": "#/channels/clearing/messages/clearingSettled"
      - "$ref": "#/channels/clearing/messages/clearingReturned"
      - "$ref": "#/channels/clearing/messages/clearingIncomingReceived"
    bindings:
      kafka:
        bindingVersion: "0.5.0"
  core-apiConsumesClearing:
    action: "receive"
    channel:
      "$ref": "#/channels/clearing"
    summary: "core-api konsumuje bank.clearing.v1 (grupa `core-api-payments`, inbox po `id`, nieznane `type` ignoruje, błąd → retry 3× → DLQ)"
    messages:
      - "$ref": "#/channels/clearing/messages/clearingSettled"
      - "$ref": "#/channels/clearing/messages/clearingReturned"
      - "$ref": "#/channels/clearing/messages/clearingIncomingReceived"
    bindings:
      kafka:
        groupId:
          type: "string"
          enum:
            - "core-api-payments"
        bindingVersion: "0.5.0"
components:
  messages:
    customerCreated:
      name: "customer.created"
      title: "customer.created"
      summary: "Utworzono klienta."
      description: "Utworzono klienta. notifications → mail powitalny. Konsumenci: notifications."
      contentType: "application/json"
      headers:
        "$ref": "./schemas/kafka-headers.json"
      payload:
        "$ref": "./schemas/events/customer.created.json"
      examples:
        - name: "przykład"
          payload:
            "$ref": "./examples/customer.created.json"
    accountOpened:
      name: "account.opened"
      title: "account.opened"
      summary: "Otwarto rachunek."
      description: "Otwarto rachunek. notifications → mail z numerem rachunku. Konsumenci: notifications."
      contentType: "application/json"
      headers:
        "$ref": "./schemas/kafka-headers.json"
      payload:
